<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>AnimeHub · Offline</title>
  <style>
    html, body { height: 100%; margin: 0; background: #121212; color: #fff; font: 15px/1.6 system-ui, sans-serif; }
    body { display: grid; place-items: center; text-align: center; }
    .mark { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%; background: #1ed760; color: #000; font-size: 2rem; font-weight: 800; }
    p { color: #b3b3b3; max-width: 380px; margin: 8px auto 24px; }
    button { border: 0; border-radius: 999px; background: #1ed760; color: #000; font: 800 .85rem system-ui; letter-spacing: .1em; text-transform: uppercase; padding: 12px 28px; cursor: pointer; }
    button:hover { background: #3cf07c; }
  </style>
</head>
<body>
  <main>
    <div class="mark">a</div>
    <h1>Can't reach AnimeHub</h1>
    <p>Check your internet connection. The app will reconnect when you retry.</p>
    <button type="button" onclick="window.animehubDesktop && window.animehubDesktop.retry()">Retry</button>
  </main>
</body>
</html>
